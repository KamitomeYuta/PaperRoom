name: Paper Room CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: paper-room-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests and build production image
        run: docker compose build web
      - name: Test HTTP authorization in an isolated database
        run: docker compose run --rm --no-deps web npm run test:http
      - name: Identify production image
        run: |
          docker tag "$COMPOSE_PROJECT_NAME-web" paper-room:ci
      - name: Scan production image and save all vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: paper-room:ci
          scanners: vuln
          format: json
          output: trivy-report.json
          exit-code: '0'
          timeout: 10m
      - name: Block fixable Critical vulnerabilities
        run: trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --timeout 10m paper-room:ci
      - name: Save vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Start shop and wait for SQLite
        run: docker compose up -d --wait --wait-timeout 90
      - name: Check storefront and database persistence
        run: |
          curl -fsS http://127.0.0.1:3001/ -o /tmp/storefront.html
          grep -q 'Paper Room' /tmp/storefront.html
          docker compose exec -T web npm run seller -- ci@example.test > /dev/null
          docker compose up -d --force-recreate --wait --wait-timeout 90
          docker compose exec -T web node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { DatabaseSync } from 'node:sqlite'
          const db = new DatabaseSync('data/prints.sqlite', { readOnly: true })
          assert.equal(db.prepare('SELECT role FROM accounts WHERE email = ?').get('ci@example.test')?.role, 'seller')
          db.close()
          JS
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and test volume
        if: always()
        run: docker compose down -v
