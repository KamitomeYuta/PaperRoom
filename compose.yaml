services:
  web:
    build: .
    ports:
      - "127.0.0.1:${PAPER_ROOM_PORT:-3001}:3000"
    volumes:
      - shop-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/shop').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
volumes:
  shop-data:
